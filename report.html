<main>
  <div class="wrap page-head" style="max-width: 820px;">
    <h1>แจ้งปัญหา / เสนอแนะ</h1>
    <p>เจอปัญหาในม็อด หรือมีไอเดียอยากบอก ส่งมาได้เลย กรอกแค่ช่องที่มีดาว <span class="req">*</span> ก็พอ</p>
  </div>

  <section style="padding-top: 24px;">
    <div class="wrap" style="max-width: 820px;">
      <form class="form" id="reportForm" novalidate>
        <div class="mode" role="tablist" aria-label="เลือกเรื่องที่จะส่ง">
          <button type="button" role="tab" data-mode="bug" aria-selected="true">🐞 แจ้งปัญหา</button>
          <button type="button" role="tab" data-mode="idea" aria-selected="false">💡 เสนอแนะ</button>
        </div>

        <!-- แจ้งปัญหา -->
        <div class="mode-fields" data-for="bug">
          <div class="field">
            <label for="game">เกมไหน <span class="req">*</span></label>
            <select id="game">
              <option value="">— เลือกเกม —</option>
              <option value="train45">Train45</option>
              <option value="yohanuma">Yohane the Parhelion - NUMAZU in the MIRAGE -</option>
              <option value="nijichizu">Love Live! Nijigasaki TOKIMEKI Roadmap to the Future</option>
            </select>
          </div>
          <div class="field">
            <span class="label">ปัญหาแบบไหน <span class="req">*</span></span>
            <div class="chips">
              <label><input type="radio" name="kind" value="แปลผิด / อ่านแปลก"> แปลผิด / อ่านแปลก</label>
              <label><input type="radio" name="kind" value="ตัวหนังสือล้น / ตกขอบ"> ตัวหนังสือล้น / ตกขอบ</label>
              <label><input type="radio" name="kind" value="สระ วรรณยุกต์ลอยหรือหาย"> สระ วรรณยุกต์ลอยหรือหาย</label>
              <label><input type="radio" name="kind" value="ยังเป็นภาษาอังกฤษ"> ยังเป็นภาษาอังกฤษ</label>
              <label><input type="radio" name="kind" value="ติดตั้งไม่ได้ / เกมเด้ง"> ติดตั้งไม่ได้ / เกมเด้ง</label>
              <label><input type="radio" name="kind" value="อื่น ๆ"> อื่น ๆ</label>
            </div>
          </div>
          <div class="field">
            <label for="where">เจอตรงไหนในเกม <span class="req">*</span></label>
            <input type="text" id="where" placeholder="เช่น ตอนคุยกับฮานามารุในบทที่ 3, หน้าตั้งค่า, คำอธิบายไอเทมดาบไฟ">
          </div>
          <div class="field">
            <label for="now">ข้อความที่เห็น</label>
            <textarea id="now" placeholder="พิมพ์ข้อความที่มีปัญหา (ไม่ต้องเป๊ะก็ได้)"></textarea>
          </div>
          <div class="field">
            <label for="should">ควรเป็นยังไง</label>
            <textarea id="should" placeholder="ถ้ารู้ว่าควรแปลว่าอะไร พิมพ์ไว้ได้เลย ไม่รู้ก็ข้ามได้"></textarea>
          </div>
          <div class="field">
            <label for="more">เพิ่มเติม</label>
            <textarea id="more" placeholder="เช่น ทำอะไรอยู่ตอนเกมเด้ง หรือแปะลิงก์รูปหน้าจอ (Google Drive, Facebook, Imgur ก็ได้)"></textarea>
          </div>
        </div>

        <!-- เสนอแนะ -->
        <div class="mode-fields" data-for="idea" hidden>
          <div class="field">
            <span class="label">เรื่องอะไร <span class="req">*</span></span>
            <div class="chips">
              <label><input type="radio" name="topic" value="อยากให้แปลเกมนี้"> 🎮 อยากให้แปลเกมนี้</label>
              <label><input type="radio" name="topic" value="อยากให้ปรับคำแปล"> ✏️ อยากให้ปรับคำแปล</label>
              <label><input type="radio" name="topic" value="ไอเดียสำหรับเว็บ/ม็อด"> 🌐 ไอเดียสำหรับเว็บ/ม็อด</label>
              <label><input type="radio" name="topic" value="ชม / ให้กำลังใจ"> 💚 ชม / ให้กำลังใจ</label>
              <label><input type="radio" name="topic" value="อื่น ๆ"> อื่น ๆ</label>
            </div>
          </div>
          <div class="field">
            <label for="ideaGame">ชื่อเกม <span class="hint-inline">(ถ้าเกี่ยวกับเกม)</span></label>
            <input type="text" id="ideaGame" placeholder="เช่น ชื่อเกมบน Steam ที่อยากให้แปล หรือเกมที่มีม็อดอยู่แล้ว">
          </div>
          <div class="field">
            <label for="idea">เล่ามาได้เลย <span class="req">*</span></label>
            <textarea id="idea" placeholder="อยากให้เป็นแบบไหน หรือคิดว่าอะไรน่าจะดีขึ้น บอกได้หมด"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="contact">ชื่อเล่น หรือช่องทางให้ติดต่อกลับ</label>
          <input type="text" id="contact" placeholder="ไม่ใส่ก็ได้">
        </div>

        <!-- กันบอทสแปม: คนจริงจะไม่เห็นช่องนี้ -->
        <input type="checkbox" id="botcheck" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">

        <div class="btns">
          <button class="btn primary" type="submit" id="sendBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z"/></svg>ส่งเลย</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
        <p class="hint">อย่าใส่ข้อมูลส่วนตัว เช่น เบอร์โทร หรือเลขบัญชี ลงในฟอร์มนะ</p>
      </form>
    </div>
  </section>
</main>
